plugins {
    id 'com.android.application'
}

android {
    namespace 'com.bestsound.dsp'
    compileSdk 35

    defaultConfig {
        minSdk 26
        targetSdk 35
        versionCode 3
        versionName "3.0"
        manifestPlaceholders = [appName: "An Sound"]
    }

    flavorDimensions = ["appType"]
    productFlavors {
        dspStudio {
            dimension "appType"
            applicationId "com.bestsound.dsp"
            versionCode 3
            versionName "3.0"
            manifestPlaceholders = [appName: "An Sound DSP"]
        }
        karaokeLive {
            dimension "appType"
            applicationId "com.bestsound.karaoke"
            versionCode 1
            versionName "1.0"
            manifestPlaceholders = [appName: "An Sound"]
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
